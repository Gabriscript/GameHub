<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>GameHub</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 40px; }
        .card {
            border: 2px solid #3b82f6; border-radius: 15px; padding: 20px;
            background: #1e293b; transition: transform 0.3s; cursor: pointer;
        }
        .card:hover { transform: translateY(-10px); border-color: #60a5fa; box-shadow: 0 0 20px #3b82f6; }
        .genre { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; }
        a { text-decoration: none; color: inherit; }
    </style>
</head>
<body>
<h1 style="text-align: center;">🎮GameHub</h1>
<div id="game-grid" class="grid">
</div>

<script>
    fetch('/games')
        .then(res => res.json())
        .then(games => {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = games.map(game => `
                <a href="${game.buildPath}">
                    <div class="card">
                        <span class="genre">${game.genre}</span>
                        <h2>${game.title}</h2>
                        <p>${game.description}</p>
                    </div>
                </a>
            `).join('');
        });
</script>
</body>
</html>
