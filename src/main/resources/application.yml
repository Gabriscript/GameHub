spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gamehub
    username: gamehub
    password: gamehub

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

web:
  resources:
    static-locations: classpath:/static/
    cache:
      period: 0
  mvc:
    static-path-pattern: /**